[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hls-alpha"
version = "2.0.0"
description = "HLS Trading — ISCF & MGD Systematic Macro Alpha Engine"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.13"
authors = [{ name = "HLS Trading Quant Research", email = "quant@hls-trading.com" }]
keywords = ["systematic", "macro", "alpha", "iscf", "mgd", "causal", "quant"]
classifiers = [
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Investment",
  "Private :: Do Not Upload",
]

dependencies = [
  "numpy>=2.1",
  "pandas>=2.2",
  "scipy>=1.14",
  "scikit-learn>=1.5",
  "click>=8.1",
  "matplotlib>=3.9",
  "seaborn>=0.13.2",
  "plotly>=6.8.0",
  "yfinance>=0.2.40",
  "pandas-datareader>=0.10",
  "statsmodels>=0.14",
  "nbformat>=5.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "pytest-xdist>=3.6",
  "ruff>=0.6",
  "mypy>=1.11",
  "jupyter>=1.1",
  "jupyterlab>=4.2",  
  "nbconvert>=7.16",
  "ipywidgets>=8.1",
]
latex = [
  "pylatex>=1.4",
]

[project.scripts]
hls-alpha = "citadel_alpha.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/python/citadel_alpha"]

[tool.hatch.build.targets.editable]
dev-mode-dirs = ["src/python"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["--tb=short"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
