PROJECT_NAME           = "Macro Alpha Engine"
PROJECT_NUMBER         = "1.0.0"
PROJECT_BRIEF          = "Five Orthogonal Alpha Signals — Systematic Macro C++26/Python 3.13"
OUTPUT_DIRECTORY       = docs
CREATE_SUBDIRS         = NO
ALLOW_UNICODE_NAMES    = YES

INPUT                  = src/cpp README.md
FILE_PATTERNS          = *.hpp *.cpp *.md
RECURSIVE              = YES
EXCLUDE_PATTERNS       = */build/* */.venv/*

EXTRACT_ALL            = YES
EXTRACT_PRIVATE        = NO
EXTRACT_STATIC         = YES
GENERATE_HTML          = YES
GENERATE_LATEX         = NO
GENERATE_XML           = NO

HTML_OUTPUT            = html
HTML_COLORSTYLE        = DARK
HTML_TIMESTAMP         = YES

HAVE_DOT               = NO
CALL_GRAPH             = NO
CALLER_GRAPH           = NO

ENABLE_PREPROCESSING   = YES
MACRO_EXPANSION        = YES

QUIET                  = YES
WARNINGS               = YES
WARN_IF_UNDOCUMENTED   = YES

JAVADOC_AUTOBRIEF      = YES
QT_AUTOBRIEF           = YES
MULTILINE_CPP_IS_BRIEF = YES

SORT_MEMBER_DOCS       = YES
SORT_BRIEF_DOCS        = YES

VERBATIM_HEADERS       = YES
SOURCE_BROWSER         = YES
INLINE_SOURCES         = NO

USE_MDFILE_AS_MAINPAGE = README.md
