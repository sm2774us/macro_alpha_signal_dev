name: CI — HLS Alpha Engine (ISCF + MGD + Causal Stack)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # 4x daily intraday rebalancing schedule (matches HLS ~4x/day frequency)
    - cron: '0 7 * * 1-5'   # London open
    - cron: '0 12 * * 1-5'  # NY open
    - cron: '0 17 * * 1-5'  # London close
    - cron: '0 21 * * 1-5'  # NY close / Asia open
  workflow_dispatch:        # <--- Add this single line to allow manual triggers

env:
  UV_VERSION: "0.5.0"
  CMAKE_BUILD_TYPE: Release
  PYTHON_VERSION: "3.13"

jobs:
  # ── 1. Python 3.13 build + full test suite ────────────────────────────
  python-build-test:
    name: Python 3.13 — Build & Test (uv)
    runs-on: ubuntu-latest

    # 1. Define the secret as a job-level env variable here
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Install deps
        run: |
          uv venv --python ${{ env.PYTHON_VERSION }}
          source .venv/bin/activate
          uv pip install -e ".[dev]"
      - name: Run tests + coverage
        run: |
          source .venv/bin/activate
          pytest tests/python/ -v --tb=short \
            --cov=src/python/citadel_alpha \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            -n auto
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
      - name: Notify Slack
        if: always() && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {"text": "*Python Tests* `${{ job.status }}` on `${{ github.ref_name }}`\nCommit: `${{ github.sha }}`"}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  # ── 2. C++26 build + GTest ────────────────────────────────────────────
  cpp-build-test:
    name: C++26 — Build & Test (CMake + GTest)
    runs-on: ubuntu-latest

    # 1. Define the secret as a job-level env variable here
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build g++-14
      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DPython3_ROOT_DIR=$(python3 -c "import sys; print(sys.prefix)")
      - name: Build C++ engine + nanobind extension
        run: cmake --build build --parallel $(nproc)
      - name: Run GTest
        run: cd build && ctest --output-on-failure --parallel $(nproc)
      - name: Notify Slack
        if: always() && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {"text": "*C++ Tests* `${{ job.status }}` on `${{ github.ref_name }}`\nCommit: `${{ github.sha }}`"}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  # ── 3. Signal Health Monitor (4x daily + every push) ─────────────────
  #    Builds C++ hot-path, runs full Python research stack via CLI,
  #    emits KPI markdown report + JSON artifacts, exits 1 on retirement.
  signal-health-monitor:
    name: Signal Health Monitor — KPIs + Half-Life + Rebalancing
    runs-on: ubuntu-latest
    needs: [python-build-test, cpp-build-test]

    # 1. Define the secret as a job-level env variable here
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv + Python deps
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          uv venv --python ${{ env.PYTHON_VERSION }}
          source .venv/bin/activate
          uv pip install -e ".[dev]"

      - name: Build + install C++ hot-path extension
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build g++-14
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DPython3_ROOT_DIR=$(python3 -c "import sys; print(sys.prefix)")
          cmake --build build --parallel $(nproc)
          cmake --install build --prefix .

      - name: Run ISCF + MGD signal health check (CLI → Python + C++ hotpath)
        run: |
          source .venv/bin/activate
          mkdir -p artifacts
          # Primary: full pipeline via hls-alpha CLI (calls C++ hotpath if .so present)
          hls-alpha hls-monitor \
            --n-assets 8 \
            --n-periods 2000 \
            --output-dir artifacts \
            --sr-floor 0.70 || MONITOR_EXIT=$?

          # Generate KPI markdown report from JSON artifacts
          python3 scripts/generate_kpi_report.py \
            --artifacts-dir artifacts \
            --output artifacts/KPI_REPORT.md \
            --session "$(date -u +'%Y-%m-%d %H:%M UTC')" \
            --commit "${{ github.sha }}" \
            --ref "${{ github.ref_name }}"

          exit ${MONITOR_EXIT:-0}
        continue-on-error: true

      - name: Upload KPI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signal-health-${{ github.run_number }}
          path: artifacts/

      - name: Post KPI summary to job summary
        if: always()
        run: |
          if [ -f artifacts/KPI_REPORT.md ]; then
            cat artifacts/KPI_REPORT.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Notify Slack — signal health
        if: always() && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {"text": "*Signal Health Monitor* `${{ job.status }}` — `${{ github.ref_name }}`\nKPI artifacts: run #${{ github.run_number }}"}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  # ── 4. C++ vs Python Benchmark ────────────────────────────────────────
  benchmark:
    name: C++ vs Python Benchmark (ISCF + MGD hotpath)
    runs-on: ubuntu-latest
    needs: [python-build-test, cpp-build-test]

    # 1. Define the secret as a job-level env variable here
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv + cmake
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          sudo apt-get update -qq && sudo apt-get install -y cmake ninja-build g++-14
          uv venv --python ${{ env.PYTHON_VERSION }}
          source .venv/bin/activate
          uv pip install -e ".[dev]"
      - name: Build C++ extension
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DPython3_ROOT_DIR=$(python3 -c "import sys; print(sys.prefix)")
          cmake --build build --parallel $(nproc)
          cmake --install build --prefix .
      - name: Run benchmark
        run: |
          source .venv/bin/activate
          mkdir -p artifacts
          hls-alpha benchmark --n-assets 8 --n-reps 5000 2>&1 | tee artifacts/benchmark_results.txt
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: artifacts/benchmark_results.txt

  # ── 5. Docker build verification ──────────────────────────────────────
  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: [python-build-test]

    # 1. Define the secret as a job-level env variable here
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t hls-alpha:ci .
      - name: Smoke test
        run: docker run --rm hls-alpha:ci hls-alpha --version
      - name: Notify Slack
        if: always() && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {"text": "*Docker Build* `${{ job.status }}` on `${{ github.ref_name }}`"}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
